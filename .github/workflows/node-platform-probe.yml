name: Native Node Platform Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/node-platform-probe.yml
      - Cargo.toml
      - Cargo.lock
      - node/**
      - casper/**
      - comm/**
      - crypto/**
      - packaging/macos/**
      - models/**
      - rholang/**
      - 'rspace\+\+/**'
      - shared/**
      - block-storage/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-platform-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Native Node macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      RUST_MIN_STACK: 8388608
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-02-09

      - name: Install native dependencies
        shell: bash -euo pipefail {0}
        run: |
          brew install protobuf pkg-config lmdb

      - name: Build and inspect node
        shell: bash -euo pipefail {0}
        run: |
          case "$(uname -m)" in
            arm64) export RUSTFLAGS='-C target-feature=+aes' ;;
            x86_64) export RUSTFLAGS='-C target-feature=+aes,+sse2' ;;
            *) exit 2 ;;
          esac
          cargo build --release --locked -p node --bin node
          file target/release/node
          otool -L target/release/node
          target/release/node --version
          (cd target/release && shasum -a 256 node > node.sha256)

      - name: Upload node binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f1r3node-macos-${{ matrix.arch }}-probe
          path: |
            target/release/node
            target/release/node.sha256
          if-no-files-found: error
          retention-days: 7

  macos-package:
    name: Native Node macOS Package and Install
    needs: macos
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Download arm64 binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: f1r3node-macos-arm64-probe
          path: artifacts/arm64

      - name: Download x86_64 binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: f1r3node-macos-x86_64-probe
          path: artifacts/x86_64

      - name: Build and install package
        shell: bash -euo pipefail {0}
        run: |
          (cd artifacts/arm64 && shasum -a 256 -c node.sha256)
          (cd artifacts/x86_64 && shasum -a 256 -c node.sha256)
          chmod +x artifacts/arm64/node artifacts/x86_64/node
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' node/Cargo.toml | head -n 1)"
          arm64_sha="$(shasum -a 256 artifacts/arm64/node | cut -d' ' -f1)"
          x86_64_sha="$(shasum -a 256 artifacts/x86_64/node | cut -d' ' -f1)"
          packaging/macos/build.sh --version "$version" --arm64 artifacts/arm64/node --arm64-sha256 "$arm64_sha" --x86_64 artifacts/x86_64/node --x86_64-sha256 "$x86_64_sha" --out dist
          packaging/macos/smoke.sh "$version" dist

      - name: Upload macOS packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f1r3node-macos-universal-packages
          path: dist/f1r3node-*-macos-universal.*
          if-no-files-found: error
          retention-days: 90

  macos-intel-install:
    name: Native Node macOS Intel Package Install
    needs: macos-package
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Download universal package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: f1r3node-macos-universal-packages
          path: dist

      - name: Install and exercise package
        shell: bash -euo pipefail {0}
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' node/Cargo.toml | head -n 1)"
          packaging/macos/smoke.sh "$version" dist

  windows:
    name: Native Node Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      RUST_MIN_STACK: 8388608
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-02-09

      - name: Install protoc
        shell: pwsh
        run: |
          choco install protoc -y --no-progress
          protoc --version

      - name: Check node
        shell: pwsh
        run: |
          cargo check --locked -p node --bin node
