name: Native Node Platform Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/node-platform-probe.yml
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - node/**
      - casper/**
      - comm/**
      - crypto/**
      - packaging/macos/**
      - models/**
      - rholang/**
      - 'rspace\+\+/**'
      - shared/**
      - block-storage/**
  workflow_dispatch:

permissions:
  contents: read

env:
  GAZE_COMPAT_REPOSITORY: ${{ vars.GAZE_COMPAT_REPOSITORY || format('{0}/F1R3Gaze', github.repository_owner) }}
  GAZE_COMPAT_REF: ${{ vars.GAZE_COMPAT_REF || 'main' }}

concurrency:
  group: node-platform-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Native Node macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      RUST_MIN_STACK: 8388608
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-02-09

      - name: Install native dependencies
        shell: bash -euo pipefail {0}
        run: |
          brew install protobuf pkg-config lmdb

      - name: Build and inspect node
        shell: bash -euo pipefail {0}
        run: |
          case "$(uname -m)" in
            arm64) export RUSTFLAGS='-C target-feature=+aes' ;;
            x86_64) export RUSTFLAGS='-C target-feature=+aes,+sse2' ;;
            *) exit 2 ;;
          esac
          cargo build --release --locked -p node --bin node
          file target/release/node
          otool -L target/release/node
          target/release/node --version
          (cd target/release && shasum -a 256 node > node.sha256)

      - name: Upload node binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f1r3node-macos-${{ matrix.arch }}-probe
          path: |
            target/release/node
            target/release/node.sha256
          if-no-files-found: error
          retention-days: 7

  macos-package:
    name: Native Node macOS Package and Install
    needs: macos
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Download arm64 binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: f1r3node-macos-arm64-probe
          path: artifacts/arm64

      - name: Download x86_64 binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: f1r3node-macos-x86_64-probe
          path: artifacts/x86_64

      - name: Build and install package
        shell: bash -euo pipefail {0}
        run: |
          (cd artifacts/arm64 && shasum -a 256 -c node.sha256)
          (cd artifacts/x86_64 && shasum -a 256 -c node.sha256)
          chmod +x artifacts/arm64/node artifacts/x86_64/node
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' node/Cargo.toml | head -n 1)"
          arm64_sha="$(shasum -a 256 artifacts/arm64/node | cut -d' ' -f1)"
          x86_64_sha="$(shasum -a 256 artifacts/x86_64/node | cut -d' ' -f1)"
          packaging/macos/build.sh --version "$version" --arm64 artifacts/arm64/node --arm64-sha256 "$arm64_sha" --x86_64 artifacts/x86_64/node --x86_64-sha256 "$x86_64_sha" --out dist
          packaging/macos/smoke.sh "$version" dist

      - name: Upload macOS packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f1r3node-macos-universal-packages
          path: dist/f1r3node-*-macos-universal.*
          if-no-files-found: error
          retention-days: 90

  macos-intel-install:
    name: Native Node macOS Intel Package Install
    needs: macos-package
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Download universal package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: f1r3node-macos-universal-packages
          path: dist

      - name: Install and exercise package
        shell: bash -euo pipefail {0}
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' node/Cargo.toml | head -n 1)"
          packaging/macos/smoke.sh "$version" dist

  macos-gaze-compat:
    name: Packaged Node and Gaze macOS Compatibility (${{ matrix.arch }})
    needs: macos-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout Node source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Checkout Gaze for live compatibility smoke
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ env.GAZE_COMPAT_REPOSITORY }}
          ref: ${{ env.GAZE_COMPAT_REF }}
          path: gaze-source
          persist-credentials: false

      - name: Download universal package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: f1r3node-macos-universal-packages
          path: dist

      - name: Install Rust for Gaze
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0

      - name: Test installed Node with Gaze client
        shell: bash -euo pipefail {0}
        timeout-minutes: 20
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' node/Cargo.toml | head -n 1)"
          package="dist/f1r3node-$version-macos-universal.pkg"
          (cd dist && shasum -a 256 -c "f1r3node-$version-macos-universal.sha256")
          cleanup() {
            if [[ -f "$HOME/Library/LaunchAgents/io.f1r3fly.f1r3node.plist" ]]; then
              /usr/local/bin/f1r3node-service uninstall
            fi
          }
          trap cleanup EXIT
          sudo installer -pkg "$package" -target /
          data_dir="$HOME/Library/Application Support/F1R3Node"
          mkdir -p "$data_dir"
          printf 'standalone = true\n' > "$data_dir/rnode.conf"
          /usr/local/bin/f1r3node-service install
          ready=0
          for ((attempt = 0; attempt < 60; attempt++)); do
            if /usr/local/bin/f1r3node-service status >/dev/null 2>&1 && curl --fail --silent --show-error --max-time 2 http://127.0.0.1:40403/status >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            [[ ! -f "$data_dir/launchd.log" ]] || tail -n 100 "$data_dir/launchd.log"
            exit 1
          fi
          RUSTFLAGS='' F1R3NODE_BASE_URL=http://127.0.0.1:40403 \
            cargo test --manifest-path gaze-source/f1r3-work/f1r3gaze/Cargo.toml \
              --locked -p gaze-shard --test live_node -- --ignored
          gaze_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' gaze-source/f1r3-work/f1r3gaze/Cargo.toml | head -n 1)
          {
            printf 'gaze_repository=%s\n' "$GAZE_COMPAT_REPOSITORY"
            printf 'gaze_revision=%s\n' "$(git -C gaze-source rev-parse HEAD)"
            printf 'gaze_version=%s\n' "$gaze_version"
            printf 'node_revision=%s\n' "$(git rev-parse HEAD)"
            printf 'node_version=%s\n' "$version"
            printf 'node_binary_sha256=%s\n' "$(shasum -a 256 /usr/local/bin/f1r3node | cut -d' ' -f1)"
            printf 'node_pkg_sha256=%s\n' "$(shasum -a 256 "$package" | cut -d' ' -f1)"
            printf 'architecture=%s\n' "$(uname -m)"
          } > "gaze-node-compatibility-$(uname -m).txt"

      - name: Upload compatibility record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f1r3node-gaze-macos-${{ matrix.arch }}
          path: gaze-node-compatibility-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 90

  windows:
    name: Native Node Windows x64 Diagnostic
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      RUST_MIN_STACK: 8388608
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-02-09

      - name: Install protoc
        shell: pwsh
        run: |
          choco install protoc -y --no-progress
          protoc --version

      - name: Check node
        shell: pwsh
        run: |
          cargo check --locked -p node --bin node
