name: Native Linux Source Package Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/package-linux-source-smoke.yml
      - .github/scripts/install-system-dependencies.sh
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - packaging/linux/**
      - node/**
      - casper/**
      - comm/**
      - crypto/**
      - models/**
      - rholang/**
      - 'rspace\+\+/**'
      - shared/**
      - block-storage/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-linux-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Native Source Packages (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64, platform: linux/amd64, arch_image: "archlinux:base-devel" }
          - { runner: ubuntu-24.04-arm, arch: arm64, platform: linux/arm64, arch_image: "menci/archlinuxarm:base-devel" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      RUST_MIN_STACK: 8388608
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-02-09

      - name: Cache build dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: native-source-${{ matrix.arch }}
          save-if: false

      - name: Install system dependencies
        shell: bash -euo pipefail {0}
        run: |
          bash .github/scripts/install-system-dependencies.sh
          sudo apt-get install -y libclang-dev clang binutils

      - name: Build native node binary
        shell: bash -euo pipefail {0}
        run: |
          case "$(uname -m)" in
            x86_64) export RUSTFLAGS="-C target-feature=+aes,+sse2" ;;
            aarch64) export RUSTFLAGS="-C target-feature=+aes" ;;
            *) exit 2 ;;
          esac
          cargo build --release --locked -p node --bin node
          mkdir -p "$RUNNER_TEMP/native"
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' node/Cargo.toml | head -n 1)"
          sha="$(sha256sum target/release/node | cut -d' ' -f1)"
          printf 'NODE_VERSION=%s\nNODE_SHA256=%s\n' "$version" "$sha" >> "$GITHUB_ENV"

      - name: Build and install DEB
        shell: bash -euo pipefail {0}
        run: |
          packaging/linux/build.sh --format deb --version "$NODE_VERSION" --binary target/release/node --sha256 "$NODE_SHA256" --out "$RUNNER_TEMP/native"
          package="$RUNNER_TEMP/native/f1r3node_${NODE_VERSION}_${{ matrix.arch }}.deb"
          packaging/linux/smoke.sh --format deb --package "$package" --version "$NODE_VERSION" --sha256 "$NODE_SHA256"
          IFS=. read -r major minor patch <<< "$NODE_VERSION"
          if ((patch > 0)); then older="$major.$minor.$((patch - 1))"
          elif ((minor > 0)); then older="$major.$((minor - 1)).1"
          elif ((major > 0)); then older="$((major - 1)).1.1"
          else exit 2
          fi
          work=$(mktemp -d)
          dpkg-deb -R "$package" "$work/stage"
          sed -i "s/^Version: .*/Version: $older/" "$work/stage/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$work/stage" "$work/older.deb"
          sudo install -d -m 0700 /var/lib/f1r3node
          printf 'preserve package state\n' | sudo tee /var/lib/f1r3node/package-smoke-sentinel >/dev/null
          sudo apt-get install -y "$work/older.deb"
          [[ "$(dpkg-query -W -f='${Version}' f1r3node)" == "$older" ]]
          sudo apt-get install -y "$package"
          [[ "$(dpkg-query -W -f='${Version}' f1r3node)" == "$NODE_VERSION" ]]
          sudo test -s /var/lib/f1r3node/package-smoke-sentinel
          [[ "$(f1r3node --version)" == "f1r3fly $NODE_VERSION" ]]
          [[ "$(sha256sum /usr/bin/f1r3node | cut -d' ' -f1)" == "$NODE_SHA256" ]]
          systemd-analyze verify /usr/lib/systemd/system/f1r3node.service
          [[ "$(systemctl is-enabled f1r3node.service 2>/dev/null || true)" != enabled ]]
          [[ "$(systemctl is-active f1r3node.service 2>/dev/null || true)" != active ]]
          sudo install -d -m 0700 /var/lib/f1r3node
          printf 'standalone = true\n' | sudo tee /var/lib/f1r3node/rnode.conf >/dev/null
          if ! sudo systemctl start f1r3node.service; then
            sudo journalctl -u f1r3node.service --no-pager -n 100
            exit 1
          fi
          ready=0
          for ((attempt = 0; attempt < 60; attempt++)); do
            if systemctl is-active --quiet f1r3node.service && curl --fail --silent --show-error --max-time 2 http://127.0.0.1:40403/status >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            sudo journalctl -u f1r3node.service --no-pager -n 100
            exit 1
          fi
          sudo systemctl stop f1r3node.service
          sudo test -s /var/lib/f1r3node/rnode.conf
          sudo apt-get remove -y f1r3node
          sudo test -s /var/lib/f1r3node/package-smoke-sentinel

      - name: Build and smoke tar archive
        shell: bash -euo pipefail {0}
        run: |
          packaging/linux/build.sh --format tar --version "$NODE_VERSION" --binary target/release/node --sha256 "$NODE_SHA256" --out "$RUNNER_TEMP/native"
          packaging/linux/smoke.sh --format tar --package "$RUNNER_TEMP/native/f1r3node-$NODE_VERSION-linux-$(uname -m).tar.gz" --version "$NODE_VERSION" --sha256 "$NODE_SHA256"

      - name: Build and install Arch package
        shell: bash -euo pipefail {0}
        run: |
          docker run --rm --platform '${{ matrix.platform }}' -v "$PWD:/src:ro" -v "$RUNNER_TEMP/native:/out" -v "$PWD/target/release/node:/node.bin:ro" -e OUT=/out -w /src '${{ matrix.arch_image }}' packaging/linux/ci-arch.sh "$NODE_VERSION" /node.bin "$NODE_SHA256"

      - name: Build and install RPM
        shell: bash -euo pipefail {0}
        run: |
          docker run --rm --platform '${{ matrix.platform }}' -v "$PWD:/src:ro" -v "$RUNNER_TEMP/native:/out" -v "$PWD/target/release/node:/node.bin:ro" -e OUT=/out -w /src fedora:43 packaging/linux/ci-rpm.sh "$NODE_VERSION" /node.bin "$NODE_SHA256"

      - name: Verify package manifest
        shell: bash -euo pipefail {0}
        run: |
          cd "$RUNNER_TEMP/native"
          sha256sum -- *.deb *.rpm *.pkg.tar.zst *.tar.gz | sort -k2 > native-packages.sha256
          test "$(wc -l < native-packages.sha256)" -eq 4
          sha256sum -c native-packages.sha256

      - name: Upload smoke packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-linux-source-smoke-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/native/*.deb
            ${{ runner.temp }}/native/*.rpm
            ${{ runner.temp }}/native/*.pkg.tar.zst
            ${{ runner.temp }}/native/*.tar.gz
            ${{ runner.temp }}/native/native-packages.sha256
          if-no-files-found: error
          retention-days: 90
